[package]
name = "dbconncheck"
version = "0.1.0"
edition = "2021"
description = "A one-command connectivity/auth/latency check against Postgres, MySQL, or Redis — the first thing you run when on-call and something can't reach its database"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/dbconncheck"
readme = "README.md"
keywords = ["postgres", "mysql", "redis", "connectivity", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "dbconncheck"
path = "src/lib.rs"

[[bin]]
name = "dbconncheck"
path = "src/main.rs"

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql"] }
redis = { version = "0.27", features = ["tokio-comp"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
